const W=[[3,0,0,0,1,0,0],[0,3,0,2,0,0,2],[0,0,3,0,0,0,0],[0,0,0,2,2,2,0]];
const R=[
{name:'北方都市型',tag:'坦荡的灯火',v:[3,2,1,1,1,1,2],quote:'爱你的人，会穿过晚高峰，把一句想念说得响亮。',person:'直爽、能扛事，喜欢把喜欢说出口；忙碌中依然为你留出明确的位置。',meet:'下班后的街角，你们躲进同一家亮着灯的小店，聊到末班车将近。',why:'你回应热情，也珍惜被坚定选择的感觉。',gift:'遇到难题时，你们能迅速站到同一边。',eggs:['把你的外套往怀里一拢','在人群中自然牵住你的手','记住你加班后的宵夜口味']},
{name:'江南水乡型',tag:'细雨里的温柔',v:[1,2,1,2,3,3,2],quote:'你等的不是某个人，是某座城里刚好同频的呼吸。',person:'细腻、温和，擅长捕捉你没有说完的半句话，喜欢让关系慢慢生长。',meet:'一场细雨把你们留在书店门口，借伞时开始聊起各自喜欢的故事。',why:'你偏爱细节与默契，愿意用耐心靠近一个人。',gift:'平淡日子里，总能找到值得纪念的一刻。',eggs:['替你把茶放到刚好入口的温度','记住你看过一半的书','在雨天多带一把伞']},

let i=0,a=Array(Q.length).fill(null);const app=document.getElementById('app');function home(){app.innerHTML='<div class="fade"><div class="eyebrow">一城一遇 · 心动有迹</div><div class="seal">有缘</div><h1>你的宿命恋人<br>来自哪个城市</h1><p class="lead">25 个关于亲密关系的小选择，拼出与你同频的恋人地域原型。跟着第一感觉走，大约 3 分钟。</p><button class="btn" id="start">开启心动旅程 →</button><p class="small">趣味恋爱想象测试。城市意象只用于故事创作，不代表当地人的真实特征，也不提供婚恋匹配服务。</p></div>';document.getElementById('start').onclick=()=>{i=0;a=Array(Q.length).fill(null);question()}}function question(){let q=Q[i];app.innerHTML='<div class="fade"><div class="top"><span>心动手札</span><span>第 '+(i+1)+' / '+Q.length+' 题</span></div><div class="track"><div class="bar" style="width:'+((i+1)/Q.length*100)+'%"></div></div><div class="eyebrow">凭第一感觉选择</div><h2>'+q[0]+'</h2><div class="options">'+q.slice(1).map((s,j)=>'<button class="option" data-n="'+j+'"><span class="letter">'+('甲乙丙丁'[j])+'</span>'+s+'</button>').join('')+'</div><div class="nav"><button class="btn ghost" id="back">'+(i?'上一题':'返回首页')+'</button><span class="small">选择后自动进入下一题</span></div></div>';app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{a[i]=+b.dataset.n;if(i===Q.length-1)result();else{i++;question()}});document.getElementById('back').onclick=()=>{if(i){i--;question()}else home()}}function match(){const sum=Array(7).fill(0);a.forEach((x,k)=>{W[x].forEach((v,d)=>sum[d]+=v);sum[(k*3+x)%7]+=.35});const normalized=sum.map(v=>v/Q.length);return R.map((r,j)=>({j,s:r.v.reduce((acc,v,d)=>acc+Math.pow(normalized[d]-v,2),0)})).sort((x,y)=>x.s-y.s||x.j-y.j)[0].j}function result(){const r=R[match()];app.innerHTML='<div class="result fade"><div class="eyebrow">心动地图 · 你的专属结果</div><div class="cardlike"><div class="seal">有缘</div><div class="small">你匹配的恋人地域原型</div><h1>'+r.name+'</h1><div class="eyebrow">'+r.tag+'</div><div class="quote">“'+r.quote+'”</div></div><div class="details"><div class="detail"><b>对方的性格画像</b>'+r.person+'</div><div class="detail"><b>你们相遇的场景</b>'+r.meet+'</div><div class="detail"><b>匹配理由</b>'+r.why+'</div><div class="detail"><b>隐藏优势</b>'+r.gift+'</div><div class="detail"><b>趣味彩蛋 · 对方大概率会做的三件小事</b>① '+r.eggs[0]+'<br>② '+r.eggs[1]+'<br>③ '+r.eggs[2]+'</div></div><div class="share"><button class="btn" id="again">重新测试</button><p class="small">截图分享你的心动地图。结果是浪漫想象，不是地域评判或婚恋建议。</p></div></div>';document.getElementById('again').onclick=home;window.scrollTo({top:0,behavior:'smooth'})}home();
